# Testes automáticos a cada envio: regras (Vitest), build e testes ponta a ponta no Chrome.
name: Testes

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regras (Vitest)
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Testes ponta a ponta (Chrome)
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 > /dev/null && break; sleep 1; done
          falhou=0
          for t in scripts/e2e*.mjs; do
            echo "::group::$t"
            if SHOTS=shots node "$t"; then echo "OK: $t"; else echo "::error::Falhou: $t"; falhou=1; fi
            echo "::endgroup::"
          done
          exit $falhou
      - name: Capturas de tela (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: shots/
          retention-days: 7
